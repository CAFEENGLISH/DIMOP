<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Költségkalkulátor - DIMOP Plusz-1.2.6/B-26</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="/" class="back-btn" aria-label="Vissza a tudásbázisra">&#8249;</a>
        <div class="logo">DIMOP<span>+</span></div>
        <div class="header-text">
          <h1>Költségkalkulátor</h1>
          <p>DIMOP Plusz-1.2.6/B-26 &mdash; Interaktív projekt költségbecslés</p>
        </div>
      </div>
      <div class="header-right">
        <span class="badge">12M Ft</span>
        <span class="badge badge-green">Vissza nem térítendő</span>
        <a href="/c/" class="header-cta" title="Váltás a budapesti DIMOP 1.2.6/C-26 pályázatra">
          <span>Budapesti (C) pályázat →</span>
        </a>
        <a href="https://www.palyazat.gov.hu/eredmenyek/tamogatott-projektek?program=Sz%C3%A9chenyi+terv+plusz&amp;op=DIMOP_PLUSZ&amp;konstrukcio=DIMOP_PLUSZ-1.2.6%2FB-26" target="_blank" rel="noopener noreferrer" class="header-cta" title="Nyertes pályázatok megtekintése a palyazat.gov.hu-n">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4h14v2c0 2.5-1.8 4.6-4.2 4.95C14.4 13 13.5 14.7 12 15.4V18h3v2H9v-2h3v-2.6c-1.5-.7-2.4-2.4-2.8-4.45C6.8 10.6 5 8.5 5 6V4zm2 2v.1c0 1.5.8 2.7 2 3.4-.1-.5-.1-1-.1-1.5V6H7zm10 0h-2v2c0 .5 0 1-.1 1.5 1.2-.7 2-1.9 2.1-3.4V6z"/></svg>
          <span>Nyertes pályázatok</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Calculator content -->
  <main class="calc-page">
    <section id="calculatorSection"></section>
  </main>

  <script src="/calculator.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { initCalculator(); });
  </script>

  <!-- AI Asszisztens chat -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
